[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neriv"
version = "0.1.0"
description = "Neriv Qwen Set Pointer 决策模型、Paged Engine 与插件化 Agent Runtime"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "transformers>=4.51",
  "peft>=0.14",
  "huggingface-hub>=0.25",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "fastapi>=0.115"]
server = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
mcp = ["mcp>=2.0,<3"]

[project.scripts]
neriv-decide = "jev_like.cli:main"
neriv-serve = "jev_like.server:main"
neriv-mcp = "jev_like.agent.mcp_server:main"

[tool.setuptools.packages.find]
include = ["jev_like*"]

[tool.setuptools.package-data]
"jev_like.agent" = ["static/index.html", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
